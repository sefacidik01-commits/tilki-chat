<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tilki Chat 🦊</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #202225;
      color: white;
    }

    .app {
      display: flex;
      height: 100vh;
    }

    .sidebar {
      width: 220px;
      background: #18191c;
      padding: 20px;
    }

    .logo {
      font-size: 24px;
      font-weight: bold;
      margin-bottom: 30px;
    }

    .channel {
      padding: 12px;
      background: #2f3136;
      border-radius: 8px;
      margin-bottom: 10px;
    }

    .chat {
      flex: 1;
      display: flex;
      flex-direction: column;
    }

    .header {
      padding: 18px;
      background: #2f3136;
      font-size: 20px;
      font-weight: bold;
    }

    .messages {
      flex: 1;
      padding: 20px;
    }

    .welcome {
      color: #aaa;
      margin-top: 30px;
    }

    .input-area {
      display: flex;
      padding: 15px;
      background: #2f3136;
      gap: 10px;
    }

    input {
      flex: 1;
      padding: 14px;
      border: none;
      border-radius: 8px;
      background: #40444b;
      color: white;
      outline: none;
    }

    button {
      padding: 14px 20px;
      border: none;
      border-radius: 8px;
      background: #5865f2;
      color: white;
      font-weight: bold;
    }
  </style>
</head>

<body>

  <div class="app">

    <div class="sidebar">
      <div class="logo">🦊 Tilki Chat</div>

      <div class="channel">
        💬 Genel
      </div>
    </div>

    <div class="chat">

      <div class="header">
        # genel
      </div>

      <div class="messages">
        <div class="welcome">
          Tilki Chat'e hoş geldin! 🦊
        </div>
      </div>

      <div class="input-area">
        <input type="text" placeholder="Mesaj yaz...">
        <button>Gönder</button>
      </div>

    </div>

  </div>

</body>
  </html>
